  <script>
    (() => {
      const TOP = 250, RH = 62, PX = 10, BAR0 = 340;

      // Build rows from their data attributes: name, bar, value, and a note on the zeros.
      const rows = Array.from(document.querySelectorAll(".row"));
      rows.forEach((r, i) => {
        const v = +r.dataset.v, w = v * PX;
        r.style.top = TOP + i * RH + "px";
        r.innerHTML =
          `<div class="nm">${r.dataset.name}</div>` +
          `<div class="bar" style="width:${w}px"></div>` +
          `<div class="val" style="left:${BAR0 + w + (v ? 22 : 0)}px">${v}%</div>` +
          (r.dataset.why ? `<div class="why">${r.dataset.why}</div>` : "");
      });
      const comodo = rows.find((r) => r.dataset.name === "Comodo");
      const ci = rows.indexOf(comodo);

      const build = () => {
        const tl = gsap.timeline({ paused: true });
        const wordsIn = (sel, at, gap = 0.07) =>
          tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: gap }, at);
        const out = (sel, at, gap = 0.02) =>
          tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: gap }, at);

        gsap.set("#numt .w, #numl .w, .ttl .w, #heroip, #hero, #sub .w, #url, #src, .row .nm, .row .val, .row .why", { opacity: 0 });
        gsap.set("#num", { opacity: 0 });
        gsap.set(".row .bar", { scaleX: 0 });

        // ---- 1. The question (it is also the first frame)
        out("#q .w", 1.5, 0.03);

        // ---- 2. The one sold as secure blocks nothing
        wordsIn("#numt .w", 1.8, 0.08);
        tl.fromTo("#num", { opacity: 0, scale: 1.08, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 2.0);
        wordsIn("#numl .w", 2.35, 0.08);
        out("#numt .w, #numl .w", 4.0, 0.02);

        // the zero flies into Comodo's slot on the board
        tl.to("#num", { x: 220 + BAR0 + 30 - 960, y: TOP + ci * RH + 31 - 500, scale: 0.09, filter: "blur(8px)", duration: 0.5, ease: "power3.inOut" }, 4.1);
        tl.to("#num", { opacity: 0, duration: 0.1 }, 4.5);

        // ---- 3. The board
        rows.forEach((r, i) => {
          const at = 4.3 + i * 0.05, v = +r.dataset.v, val = r.querySelector(".val");
          tl.fromTo(r.querySelector(".nm"), { opacity: 0, x: -20, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, at);
          if (v) {
            tl.fromTo(r.querySelector(".bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, at + 0.06);
            const o = { v: 0 };
            tl.fromTo(o, { v: 0 }, { v, duration: 0.8, ease: "expo.out", onUpdate: () => (val.textContent = Math.round(o.v) + "%") }, at + 0.06);
          }
          tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.15 }, r === comodo ? 4.5 : at + 0.12);
        });
        wordsIn("#t1 .w", 4.55, 0.08);
        tl.fromTo(".row .why", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", stagger: 0.04 }, 5.4);
        // punch in on Quad9
        tl.to("#cam", { scale: 1.1, x: 40, y: 60, duration: 0.55, ease: "power2.inOut" }, 6.9);

        // ---- 4. Quad9's name grows into the title
        out("#t1 .w", 8.0);
        rows.forEach((r) => { if (!r.classList.contains("win")) out(r, 8.0, 0); });
        const win = rows.find((r) => r.classList.contains("win"));
        out(win.querySelectorAll(".bar, .val"), 8.05, 0);
        tl.to("#cam", { scale: 1, x: 0, y: 0, duration: 0.4, ease: "power2.inOut" }, 8.05);
        const qn = win.querySelector(".nm");
        tl.to(qn, { x: 960 - 220 - 50, y: 425 - parseFloat(win.style.top) - 30, scale: 5.5, filter: "blur(10px)", color: "#7cf29a", duration: 0.35, ease: "power3.in" }, 8.3);
        tl.to(qn, { opacity: 0, duration: 0.08 }, 8.58);
        tl.fromTo("#hero", { opacity: 0, scale: 1.12, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 8.56);
        tl.fromTo("#heroip", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.7);
        wordsIn("#sub .w", 8.7, 0.05);
        tl.fromTo("#url", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, 8.85);
        tl.fromTo("#src", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 8.9);
        window.__timelines["blocking"] = tl;
      };
      Promise.all([document.fonts.load("600 340px Geist"), document.fonts.load("400 40px 'JetBrains Mono'"), document.fonts.ready]).then(build);
    })();
  </script>
